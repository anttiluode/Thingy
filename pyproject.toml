[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thingy-self-ping"
version = "0.1.0"
description = "A trainable, inspectable self-address workspace and fast-codebook laboratory"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
license = {text = "MIT"}

[project.scripts]
thingy = "thingy.__main__:main"

[tool.setuptools.packages.find]
include = ["thingy*"]

[tool.setuptools.package-data]
thingy = ["web/*.html", "assets/*.json"]
